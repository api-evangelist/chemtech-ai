description: ChemTech AI is an industrial software company, founded in 2018 and headquartered in New York,
  that builds autonomous AI control systems for chemical production plants. Its software continuously
  optimizes manufacturing by autonomously adjusting DCS setpoints to push plants to their maximum safe
  capacity, sustaining peak production while reducing emissions and losses. The platform is applied across
  chemical processes including ammonia, nitric acid, phosphoric acid, sulfuric acid, methanol, ethanol, and
  polyethylene, serving the chemicals, food, cosmetics, and oil and gas sectors. ChemTech AI is a portfolio
  company of 500 Global. No public developer API, SDKs, or developer portal are currently published.
